<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>火车档案 · Train Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff;--bg-2:#f5f5f5;--surface:#ffffff;--surface-2:#fafafa;
    --line:#e0e0e0;--line-2:#eeeeee;
    --acc:#2a65cc;--acc-2:#4a82d6;--acc-light:#e8f0fc;
    --ink:#1a1a1a;--ink-mute:#666666;--ink-dim:#999999;
    --red:#c0492c;--green:#5a7d3a;
    --edit-mark:#5a7d3a;--edit-mark-line:#9ab86a;
    --shadow:0 2px 8px rgba(0,0,0,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit}
  button{font-family:inherit}

  /* ============ NAV ============ */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 48px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer}
  .logo-mark{
    width:38px;height:38px;border-radius:50%;border:2px solid var(--acc);
    display:grid;place-items:center;
    background:radial-gradient(circle at 30% 30%,#ffffff,#f5f5f5);
    box-shadow:inset 0 0 12px rgba(0,0,0,.04),0 0 18px rgba(42,101,204,.12);
  }
  .logo-mark svg{width:20px;height:20px}
  .logo-text{font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px;letter-spacing:2px;color:var(--ink)}
  .logo-text span{color:var(--acc)}
  .nav-links{display:flex;gap:34px;list-style:none;align-items:center}
  .nav-links a{
    color:var(--ink-mute);text-decoration:none;font-size:14px;font-weight:500;
    letter-spacing:.5px;position:relative;transition:color .25s;cursor:pointer;
  }
  .nav-links a:hover{color:var(--acc-2)}
  .nav-links a.active{color:var(--ink)}
  .nav-links a.active::after{
    content:"";position:absolute;left:0;right:0;bottom:-8px;height:2px;background:var(--acc);
  }
  .nav-links a.nav-hot{color:#e07355;font-weight:600}
  .nav-links a.nav-hot::before{content:"●";font-size:8px;vertical-align:2px;margin-right:5px;color:#e07355;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .nav-search{
    width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:transparent;color:var(--ink-mute);cursor:pointer;display:grid;place-items:center;
    transition:.25s;
  }
  .nav-search:hover{border-color:var(--acc);color:var(--acc)}

  /* ============ HERO ============ */
  .hero{
    min-height:100vh;position:relative;
    display:flex;flex-direction:column;justify-content:center;
    padding:120px 48px 80px;
    background:
      radial-gradient(ellipse 80% 60% at 70% 20%, rgba(42,101,204,.06), transparent 60%),
      radial-gradient(ellipse 60% 40% at 20% 80%, rgba(42,101,204,.04), transparent 60%);
    overflow:hidden;
  }
  .tracks{
    position:absolute;left:0;right:0;bottom:0;height:38vh;
    perspective:600px;perspective-origin:50% 0;pointer-events:none;opacity:.3;
  }
  .track{
    position:absolute;left:50%;bottom:0;width:300%;height:2px;
    background:linear-gradient(90deg,transparent,var(--acc) 20%,var(--acc) 80%,transparent);
    transform:translateX(-50%);box-shadow:0 0 8px rgba(42,101,204,.3);
  }
  .ties{
    position:absolute;left:0;right:0;bottom:0;height:100%;
    background-image:repeating-linear-gradient(90deg,transparent 0 60px,rgba(42,101,204,.15) 60px 64px);
    transform:rotateX(72deg);transform-origin:bottom;
    mask-image:linear-gradient(180deg,transparent,#000 70%);
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 70%);
  }
  .hero-inner{position:relative;z-index:2;max-width:1200px;margin:0 auto;width:100%}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:3px;
    color:var(--acc);text-transform:uppercase;margin-bottom:28px;
  }
  .eyebrow::before{content:"";width:32px;height:1px;background:var(--acc)}
  .hero h1{
    font-family:"Noto Serif SC",serif;font-weight:900;
    font-size:clamp(64px,11vw,168px);line-height:.92;letter-spacing:-2px;
    color:var(--ink);margin-bottom:8px;
  }
  .hero h1 .accent{color:var(--acc);font-style:italic}
  .hero-sub-latin{
    font-family:"Big Shoulders Display",sans-serif;font-weight:700;
    font-size:clamp(28px,4vw,52px);letter-spacing:8px;color:var(--ink-dim);
    text-transform:uppercase;margin-bottom:36px;
  }
  .hero p.lead{max-width:560px;font-size:17px;color:var(--ink-mute);font-weight:300;margin-bottom:44px}
  .search-bar{
    display:flex;align-items:center;gap:0;max-width:620px;
    background:rgba(245,245,245,.8);border:1px solid var(--line);
    border-radius:4px;overflow:hidden;transition:border-color .3s,box-shadow .3s;
  }
  .search-bar:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(42,101,204,.1)}
  .search-bar .icon{padding:0 18px;color:var(--ink-dim)}
  .search-bar input{
    flex:1;background:transparent;border:none;outline:none;color:var(--ink);
    font-family:inherit;font-size:15px;padding:18px 0;
  }
  .search-bar input::placeholder{color:var(--ink-dim)}
  .search-bar button{
    background:var(--acc);color:#fff;border:none;cursor:pointer;
    padding:18px 28px;font-family:"Big Shoulders Display",sans-serif;font-weight:700;
    letter-spacing:2px;font-size:15px;transition:background .25s;
  }
  .search-bar button:hover{background:var(--acc-2)}
  .hero-tags{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap}
  .hero-tags span{
    font-size:12px;color:var(--ink-mute);padding:6px 14px;
    border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:.25s;
  }
  .hero-tags span:hover{border-color:var(--acc);color:var(--acc)}

  /* ============ STATS ============ */
  .stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2);display:grid;grid-template-columns:repeat(4,1fr)}
  .stat{padding:42px 36px;text-align:center;border-right:1px solid var(--line);position:relative}
  .stat:last-child{border-right:none}
  .stat-num{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:56px;color:var(--acc);line-height:1}
  .stat-num small{font-size:18px;color:var(--ink-mute);margin-left:4px;font-weight:500}
  .stat-label{font-size:13px;color:var(--ink-mute);letter-spacing:2px;margin-top:10px;text-transform:uppercase}
  .stat-cn{font-size:14px;color:var(--ink);margin-top:4px}

  /* ============ SECTION ============ */
  section.block{padding:100px 48px;max-width:1280px;margin:0 auto}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:48px;flex-wrap:wrap;gap:20px}
  .sec-title{display:flex;flex-direction:column;gap:6px}
  .sec-title .kicker{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--acc);letter-spacing:3px;text-transform:uppercase}
  .sec-title h2{font-family:"Noto Serif SC",serif;font-weight:900;font-size:42px;letter-spacing:1px}
  .sec-more{color:var(--ink-mute);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:8px;transition:color .25s;cursor:pointer}
  .sec-more:hover{color:var(--acc)}

  .qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .qa-card{
    position:relative;padding:44px;border:1px solid var(--line);
    background:linear-gradient(135deg,var(--surface) 0%,var(--bg-2) 100%);
    border-radius:6px;text-decoration:none;color:inherit;overflow:hidden;
    transition:transform .35s,border-color .35s;cursor:pointer;
  }
  .qa-card::before{
    content:"";position:absolute;top:0;left:0;width:4px;height:100%;
    background:var(--acc);transform:scaleY(0);transform-origin:top;transition:transform .4s;
  }
  .qa-card:hover{transform:translateY(-6px);border-color:var(--acc)}
  .qa-card:hover::before{transform:scaleY(1)}
  .qa-card .qa-icon{width:60px;height:60px;border:1px solid var(--acc);border-radius:6px;display:grid;place-items:center;color:var(--acc);margin-bottom:28px;background:rgba(42,101,204,.06)}
  .qa-card .qa-tag{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--acc);letter-spacing:2px;margin-bottom:10px}
  .qa-card h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:30px;margin-bottom:12px}
  .qa-card p{color:var(--ink-mute);font-size:15px;max-width:420px;margin-bottom:24px}
  .qa-card .qa-count{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-dim)}
  .qa-card .qa-count b{color:var(--acc-2);font-size:18px}
  .qa-arrow{position:absolute;right:36px;bottom:36px;color:var(--ink-dim);transition:.35s}
  .qa-card:hover .qa-arrow{color:var(--acc);transform:translate(4px,-4px)}

  .arc-grid{display:flex;flex-direction:column;gap:0}
  .arc-card{
    padding:12px 0;border-bottom:1px solid var(--line-2);cursor:pointer;
    position:relative;transition:color .15s;
  }
  .arc-card:last-child{border-bottom:none}
  .arc-card:hover{color:var(--acc)}
  .arc-card .stamp{
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1px;
    color:var(--ink-dim);display:inline-block;margin-right:8px;
  }
  .arc-card .type{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:10px;padding:1px 6px;border:1px solid var(--line);border-radius:2px;margin-bottom:6px;letter-spacing:1px}
  .type-line{background:rgba(42,101,204,.08);color:var(--acc);border-color:rgba(42,101,204,.25)}
  .type-train{background:rgba(192,73,44,.12);color:#e07355;border-color:rgba(192,73,44,.3)}
  .arc-card h4{font-weight:700;font-size:17px;margin-bottom:2px}
  .arc-card .sub{font-size:12px;color:var(--ink-dim);margin-bottom:6px}
  .arc-meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-mute)}
  .arc-meta .row{display:inline-flex;gap:4px}
  .arc-meta .row .k{color:var(--ink-dim)}
  .arc-meta .row .v{color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:11px}
  .arc-card .date{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-dim);margin-top:4px}

  /* CTA */
  .cta{
    margin:40px 48px 0;max-width:1280px;margin-left:auto;margin-right:auto;
    border:1px solid var(--line);border-radius:8px;overflow:hidden;
    background:radial-gradient(ellipse at 80% 20%,rgba(42,101,204,.06),transparent 60%),var(--bg-2);
    padding:64px 56px;display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap;position:relative;
  }
  .cta::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(45deg,transparent 0 18px,rgba(42,101,204,.03) 18px 19px)}
  .cta-text{position:relative;z-index:1}
  .cta-text .kicker{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--acc);letter-spacing:3px;margin-bottom:14px;text-transform:uppercase}
  .cta-text h3{font-family:"Noto Serif SC",serif;font-weight:900;font-size:36px;margin-bottom:12px;line-height:1.2}
  .cta-text p{color:var(--ink-mute);max-width:480px}
  .btn-brass{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--acc);color:#fff;border:none;cursor:pointer;
    padding:8px 16px;font-family:inherit;font-weight:600;
    font-size:13px;border-radius:2px;transition:background .15s;
    text-decoration:none;
  }
  .btn-brass:hover{background:var(--acc-2)}
  .btn-ghost{
    display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--ink);
    border:1px solid var(--line);cursor:pointer;padding:8px 16px;font-family:inherit;font-size:13px;border-radius:2px;text-decoration:none;transition:border-color .15s;
  }
  .btn-ghost:hover{border-color:var(--acc);color:var(--acc)}
  .btn-danger{
    display:inline-flex;align-items:center;gap:6px;background:transparent;color:#e07355;
    border:1px solid rgba(192,73,44,.4);cursor:pointer;padding:8px 14px;font-size:12px;
    border-radius:2px;transition:.15s;font-family:inherit;
  }
  .btn-danger:hover{background:rgba(192,73,44,.1);border-color:#e07355}

  /* FOOTER */
  footer{margin-top:100px;border-top:1px solid var(--line);background:var(--bg-2);padding:60px 48px 30px}
  .foot-inner{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px}
  .foot-brand .logo{margin-bottom:18px}
  .foot-brand p{color:var(--ink-mute);font-size:14px;max-width:320px}
  .foot-col h5{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--acc);letter-spacing:2px;margin-bottom:18px;text-transform:uppercase}
  .foot-col a{display:block;color:var(--ink-mute);text-decoration:none;font-size:14px;margin-bottom:10px;transition:color .25s;cursor:pointer}
  .foot-col a:hover{color:var(--acc)}
  .foot-bottom{max-width:1280px;margin:48px auto 0;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--ink-dim);font-size:12px;font-family:"JetBrains Mono",monospace;letter-spacing:1px}

  /* ============ PAGE COMMON ============ */
  .page{padding:100px 48px 30px;max-width:1280px;margin:0 auto;min-height:80vh}

  /* ============ HOMEPAGE: flat compact ============ */
  .hm{padding:100px 48px 20px;max-width:1280px;margin:0 auto}
  .hm-title{font-family:"Noto Serif SC",serif;font-weight:900;font-size:28px;line-height:1;margin-bottom:4px}
  .hm-sub{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);letter-spacing:1px;margin-bottom:18px}
  .hm-search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:28px}
  .hm-search svg{color:var(--ink-dim);flex-shrink:0}
  .hm-search input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:14px;padding:4px 0}
  .hm-search input::placeholder{color:var(--ink-dim)}

  .hm-section{margin-bottom:28px}
  .hm-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .hm-head h2{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  .hm-head h2 .hm-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:2px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
  .hm-head h2 small{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);font-weight:400}
  .hm-more{color:var(--ink-mute);text-decoration:none;font-size:12px;font-family:'JetBrains Mono',monospace}

  .hm-stations{display:flex;flex-wrap:wrap;gap:4px}
  .hm-station{
    display:inline-flex;align-items:center;gap:2px;
    padding:2px 8px;border:1px solid var(--line);border-radius:2px;
    text-decoration:none;color:var(--ink);font-size:12px;font-weight:500;
    transition:border-color .15s;background:var(--surface);
  }
  .hm-station:hover{border-color:var(--acc)}
  .hm-station .s-n{font-size:10px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace}

  .hm-list{display:flex;flex-direction:column}
  .hm-row{
    display:flex;align-items:center;gap:8px;
    padding:6px 0;border-bottom:1px solid var(--line-2);cursor:pointer;
    font-size:13px;transition:color .15s;text-decoration:none;color:inherit;
  }
  .hm-row:last-child{border-bottom:none}
  .hm-row:hover{color:var(--acc)}
  .hm-row .r-code{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;width:60px;flex-shrink:0}
  .hm-row .r-fromto{color:var(--ink-mute);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hm-row .r-type{font-size:10px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;width:48px;flex-shrink:0;text-align:right}
  .hm-row .r-status{font-size:10px;font-family:'JetBrains Mono',monospace;width:36px;flex-shrink:0;text-align:right}
  .hm-row .r-lines{font-size:10px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;width:120px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .hm-cta{margin-top:20px;padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;font-size:13px;color:var(--ink-mute)}
  .link-brass{color:var(--acc);text-decoration:none;font-weight:500;cursor:pointer}
  .link-brass:hover{color:var(--acc-2)}
  .breadcrumb{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);margin-bottom:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .breadcrumb a{color:var(--ink-mute);text-decoration:none;cursor:pointer}
  .breadcrumb a:hover{color:var(--acc)}
  .breadcrumb span.sep{color:var(--ink-dim)}
  .page-title{font-family:"Noto Serif SC",serif;font-weight:900;font-size:32px;margin-bottom:4px}
  .page-sub{font-size:13px;color:var(--ink-dim);margin-bottom:24px;font-family:"JetBrains Mono",monospace;letter-spacing:1px}

  /* toolbar: search + filter */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
  .toolbar .search-mini{
    flex:1;min-width:200px;display:flex;align-items:center;gap:8px;
    border-bottom:1px solid var(--line);padding:6px 0;
  }
  .toolbar .search-mini:focus-within{border-color:var(--acc)}
  .toolbar .search-mini input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:13px;padding:4px 0}
  .toolbar .search-mini input::placeholder{color:var(--ink-dim)}
  .toolbar .search-mini .icon{color:var(--ink-dim)}
  .filter-chip{
    font-size:12px;color:var(--ink-mute);padding:4px 12px;border:1px solid var(--line);
    border-radius:3px;cursor:pointer;transition:.15s;background:transparent;
  }
  .filter-chip:hover{border-color:var(--acc);color:var(--acc)}
  .filter-chip.active{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:500}
  .filter-select{
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:5px 10px;border-radius:2px;font-family:inherit;font-size:12px;cursor:pointer;outline:none;
  }
  .filter-select:focus{border-color:var(--acc)}

  /* list grid */
  .list-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .list-grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .empty-state{
    grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--ink-dim);
  }
  .empty-state svg{margin-bottom:12px;opacity:.4}
  .empty-state h4{font-size:18px;color:var(--ink-mute);margin-bottom:6px}

  /* ============ DETAIL PAGE (flat) ============ */
  .detail-hero{padding:0 0 20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .detail-stamp{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1px;color:var(--ink-dim);display:inline-block;margin-right:12px}
  .detail-type{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1px;padding:2px 8px;border:1px solid var(--line);border-radius:2px;margin-bottom:12px}
  .detail-name{font-family:"Noto Serif SC",serif;font-weight:900;font-size:36px;letter-spacing:0;margin-bottom:4px;line-height:1.15}
  .detail-latin{font-family:"Big Shoulders Display",sans-serif;font-size:16px;letter-spacing:3px;color:var(--ink-dim);text-transform:uppercase;margin-bottom:10px}

  .detail-life{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px;font-size:13px;color:var(--ink-mute)}
  .detail-life em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:11px;padding:2px 7px;border-radius:2px;letter-spacing:1px}
  .detail-life .life-item{font-size:12px;color:var(--ink-mute)}
  .detail-life .life-item b{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-dim);margin-right:4px;letter-spacing:1px}

  .sec-count{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);font-weight:400}
  .line-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .line-node{
    display:flex;flex-direction:column;gap:1px;padding:6px 10px;
    cursor:pointer;transition:color .15s;text-decoration:none;color:inherit;
  }
  .line-node:hover{color:var(--acc)}
  .ln-idx{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--acc);letter-spacing:1px}
  .ln-name{font-family:"Noto Serif SC",serif;font-weight:700;font-size:13px}
  .ln-meta{font-size:10px;color:var(--ink-dim)}
  .ln-arrow{color:var(--ink-dim);font-size:14px;font-weight:300}

  .c-lines{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}
  .c-mute{color:var(--ink-dim);font-size:12px}
  .line-chip{
    font-size:11px;padding:2px 8px;background:rgba(42,101,204,.1);color:var(--acc);
    border:1px solid rgba(42,101,204,.25);border-radius:3px;cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .line-chip:hover{background:rgba(42,101,204,.2)}
  .chip-arrow{color:var(--ink-dim);font-size:11px;margin:0 1px}

  .line-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .line-pick{
    display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;
    background:var(--bg-2);border:1px solid var(--line);border-radius:6px;transition:.2s;
  }
  .line-pick:hover{border-color:var(--acc)}
  .line-pick.checked{background:rgba(42,101,204,.1);border-color:var(--acc)}
  .line-pick input{accent-color:var(--acc);width:16px;height:16px;cursor:pointer}
  .line-pick .lp-name{font-size:13px;color:var(--ink);font-weight:500}
  .line-pick .lp-meta{font-size:11px;color:var(--ink-dim);margin-left:auto;white-space:nowrap}
  .detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

  .detail-body{display:grid;grid-template-columns:2fr 1fr;gap:24px}

  .station-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
  .station-tag{
    display:inline-flex;align-items:center;gap:2px;
    padding:2px 8px;border:1px solid var(--line);border-radius:2px;
    text-decoration:none;color:var(--ink);font-size:12px;font-weight:500;
    transition:border-color .15s;background:var(--surface);
  }
  .station-tag:hover{border-color:var(--acc);color:var(--acc)}
  .station-tag .s-count{font-size:10px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace}
  .station-section{margin-bottom:24px}
  .station-section:last-child{margin-bottom:0}
  .station-section h4{font-weight:700;font-size:15px;margin-bottom:10px}

  .station-hero{padding:0 0 16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .station-hero .s-code{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);letter-spacing:1px}
  .station-hero h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:32px}

  .detail-section{margin-bottom:20px}
  .detail-section h3{font-weight:700;font-size:16px;margin-bottom:12px}
  .param-table{display:grid;grid-template-columns:140px 1fr;gap:0}
  .param-table .pk{padding:8px 0;border-bottom:1px solid var(--line-2);color:var(--ink-dim);font-size:13px;font-family:"JetBrains Mono",monospace}
  .param-table .pv{padding:8px 0;border-bottom:1px solid var(--line-2);color:var(--ink);font-size:13px;font-weight:500}
  .param-table .pk:last-child,.param-table .pv:last-child{border-bottom:none}
  .desc-text{color:var(--ink-mute);font-size:14px;line-height:1.7}

  .row-table{display:flex;flex-direction:column}
  .row-thead{
    display:none;
  }
  .row-tr{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;
    padding:6px 0;border-bottom:1px solid var(--line-2);cursor:pointer;transition:color .15s;
  }
  .row-tr:last-child{border-bottom:none}
  .row-tr:hover{color:var(--acc)}
  .row-tr > span{display:inline;min-width:0}
  .row-tr .c-no{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);width:48px;flex-shrink:0}
  .row-tr .c-name b{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14px}
  .row-tr .c-name small{font-size:10px;color:var(--ink-dim);margin-left:4px}
  .row-tr .c-fromto{color:var(--ink-mute);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-tr .c-num{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-mute)}
  .row-tr .c-tag{font-size:11px}
  .row-tr em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:10px;padding:2px 6px;border-radius:2px;letter-spacing:1px;display:inline-block}
  em.t-yes{background:rgba(107,142,78,.15);color:#9bbf78;border:1px solid rgba(107,142,78,.3)}
  em.t-no{background:rgba(154,144,129,.1);color:var(--ink-mute);border:1px solid var(--line)}
  em.t-train{background:rgba(192,73,44,.12);color:#e07355;border:1px solid rgba(192,73,44,.3)}

  /* 字段级就地编辑：下划线常驻 */
  .pv-editable{
    display:inline-block;cursor:text;padding:2px 2px;margin:0 1px;
    border-bottom:2px dashed #9ab86a;
    transition:border-color .2s,color .2s;border-radius:0;
  }
  .pv-editable:hover{border-bottom-color:var(--edit-mark);color:var(--edit-mark)}
  .pv-editable::after{
    content:"✎";color:var(--edit-mark);margin-left:6px;font-size:11px;
    vertical-align:middle;opacity:.45;transition:opacity .2s;
  }
  .pv-editable:hover::after{opacity:1}
  .pv-editing{
    display:inline-block;
    background:var(--surface);border:1px solid var(--edit-mark);
    padding:4px 8px;border-radius:3px;outline:none;color:var(--ink);
    font-family:inherit;font-size:14px;font-weight:500;min-width:120px;
  }
  .pv-editing:focus{box-shadow:0 0 0 2px rgba(90,125,58,.2)}
  .pv-edit-hint{
    font-size:11px;color:var(--ink-dim);font-family:"JetBrains Mono",monospace;
    margin-bottom:12px;border-bottom:1px dashed var(--line-2);padding-bottom:8px;
  }
  .timeline{display:flex;flex-direction:column;gap:0;padding-left:0;margin-top:10px}
  .tl-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line-2)}
  .tl-item:last-child{border-bottom:none}
  .tl-date{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--acc);letter-spacing:1px;white-space:nowrap;width:80px;flex-shrink:0}
  .tl-text{font-size:13px;color:var(--ink)}

  /* 车次版本演变时间线（区块3 形态） */
  .ver-tl{border-left:2px solid var(--line);margin-left:2px;padding-left:16px}
  .ver-tli{position:relative;padding:6px 0 14px}
  .ver-tli::before{content:"";position:absolute;left:-21px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--surface);box-sizing:border-box}
  .ver-tli.old::before{background:var(--ink-dim);box-shadow:none}
  .ver-tli .vd{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--acc);margin-bottom:2px;display:flex;align-items:center;gap:8px}
  .ver-tli.old .vd{color:var(--ink-dim)}
  .ver-tli .vt{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .ver-tli .vr{font-size:12px;color:var(--ink-mute);margin-top:2px}
  .ver-tli .vrel{display:inline-block;font-size:10px;padding:1px 6px;border:1px solid rgba(42,101,204,.3);border-radius:2px;color:var(--acc);font-family:"JetBrains Mono",monospace}
  .ver-tli .mark{font-size:10px;padding:1px 6px;border-radius:2px;font-family:"JetBrains Mono",monospace;font-weight:400}
  .m-go{background:var(--green);color:#fff}
  .m-stop{background:var(--red);color:#fff}
  .ver-add{
    display:inline-flex;align-items:center;gap:6px;margin-top:14px;
    font-size:12px;color:var(--acc);border:1px dashed rgba(42,101,204,.4);border-radius:2px;
    padding:6px 12px;cursor:pointer;background:transparent;font-family:inherit;
  }
  .ver-add:hover{background:rgba(42,101,204,.06)}

  /* 模拟热评 */
  .hot-comment-list{margin-bottom:24px;border:1px solid var(--line-2);border-radius:4px;padding:14px 16px 6px;background:rgba(42,101,204,.025)}
  .hot-comment-list .hc-tag{
    display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;
    color:#fff;background:var(--acc);padding:2px 7px;border-radius:2px;margin-bottom:10px;
    font-family:"JetBrains Mono",monospace;letter-spacing:1px;
  }
  .hot-comment{
    padding:10px 0 12px;border-top:1px dashed var(--line-2);
  }
  .hot-comment:first-of-type{border-top:none;padding-top:0}
  .hot-comment .hc-text{font-size:13px;color:var(--ink);line-height:1.7}
  .hot-comment .hc-meta{margin-top:6px;font-size:11px;color:var(--ink-dim);display:flex;gap:12px;flex-wrap:wrap}
  .hot-comment .hc-meta b{color:var(--acc);font-family:"JetBrains Mono",monospace;font-weight:600}
  .hot-comment .hc-author{font-weight:600;color:var(--ink-mute);margin-right:2px}
  .sidebar-card{border-bottom:1px solid var(--line);padding:0 0 16px;margin-bottom:16px;background:transparent}
  .sidebar-card h4{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);letter-spacing:1px;margin-bottom:10px}
  .sidebar-card .meta-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line-2)}
  .sidebar-card .meta-row:last-child{border-bottom:none}
  .sidebar-card .meta-row .k{color:var(--ink-dim)}
  .sidebar-card .meta-row .v{color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:11px}
  .sidebar-card .meta-row .v.src-tag{font-size:10px;color:var(--acc);border:1px solid rgba(42,101,204,.3);background:rgba(42,101,204,.06);padding:1px 6px;border-radius:2px;white-space:normal;line-height:1.4;margin-left:6px}

  /* ============ FORM ============ */
  .form-wrap{max-width:880px;margin:0 auto}

  /* 模板切换条 */
  .tpl-switcher{
    display:flex;align-items:center;flex-wrap:wrap;gap:6px;
    margin-bottom:16px;padding:10px 0;border-bottom:1px solid var(--line);
  }
  .tpl-label{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);margin-right:4px}
  .tpl-chip{
    background:transparent;border:1px solid var(--line);color:var(--ink-mute);
    padding:3px 10px;border-radius:2px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit;
  }
  .tpl-chip:hover{border-color:var(--acc);color:var(--acc)}
  .tpl-chip.active{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:500}
  .tpl-chip.tpl-blank{margin-left:auto;border-style:dashed;color:var(--ink-dim)}
  .form-card{padding:0;border:none;background:transparent}
  .form-row{margin-bottom:16px}
  .form-row label{display:block;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-dim);margin-bottom:6px}
  .form-row label .req{color:#e07355;margin-left:4px}
  .form-row input,.form-row select,.form-row textarea{
    width:100%;background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
    padding:10px 14px;border-radius:2px;font-family:inherit;font-size:13px;outline:none;transition:.15s;
  }
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--acc)}
  .form-row textarea{resize:vertical;min-height:100px;line-height:1.6}
  .form-row select{cursor:pointer}
  .form-row .hint{font-size:11px;color:var(--ink-dim);margin-top:4px}
  .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
  .form-switch{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--line)}
  .form-switch button{
    flex:1;background:transparent;color:var(--ink-mute);border:none;cursor:pointer;
    padding:12px;font-family:inherit;font-weight:600;font-size:13px;transition:.15s;border-bottom:2px solid transparent;
  }
  .form-switch button.active{color:var(--acc);border-bottom-color:var(--acc)}

  /* toast */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
    background:var(--surface-2);border:1px solid var(--acc);color:var(--ink);
    padding:14px 24px;border-radius:6px;font-size:14px;z-index:1000;
    box-shadow:var(--shadow);transition:transform .35s;opacity:0;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  /* modal */
  .modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;
    display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);
  }
  .modal-mask.show{display:flex}
  .modal{
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    padding:36px;max-width:440px;width:90%;
  }
  .modal h3{font-family:"Noto Serif SC",serif;font-size:22px;margin-bottom:12px}
  .modal p{color:var(--ink-mute);font-size:14px;margin-bottom:24px}
  .modal-actions{display:flex;gap:12px;justify-content:flex-end}

  /* animations */
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .hero .eyebrow{animation:rise .8s .1s both}
  .hero h1{animation:rise .9s .2s both}
  .hero-sub-latin{animation:rise .9s .35s both}
  .hero p.lead{animation:rise .9s .5s both}
  .search-bar{animation:rise .9s .65s both}
  .hero-tags{animation:rise .9s .8s both}
  .page,.arc-card,.list-grid > *{animation:fadeIn .4s both}

  /* responsive */
  @media(max-width:900px){
    nav{padding:14px 18px}
    .nav-links{display:none}
    .logo-text{font-size:16px;letter-spacing:1px}
    .logo-mark{width:32px;height:32px}

    .hm{padding:80px 14px 20px}
    .hm-title{font-size:24px}
    .hm-search{margin-bottom:18px}
    .hm-section{margin-bottom:20px}
    .hm-row .r-lines{display:none}
    .hm-row .r-type{display:none}

    .line-chip{font-size:10px;padding:2px 6px}

    .hm-cta{font-size:13px}

    .detail-life{gap:8px;font-size:12px}
    .detail-life .life-item{font-size:12px}
    .line-chain{flex-direction:column;align-items:stretch;gap:2px}
    .line-node{padding:4px 8px}
    .ln-arrow{transform:rotate(90deg);text-align:center;font-size:12px}
    .line-picker{grid-template-columns:1fr}
    .toolbar{flex-wrap:wrap}
    .filter-select{flex:1 1 120px;min-width:120px}

    .hero{padding:110px 24px 60px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat:nth-child(2){border-right:none}
    .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--line)}
    section.block{padding:70px 24px}
    .qa-grid{grid-template-columns:1fr}
    .arc-grid{flex-direction:column}
    .list-grid,.list-grid.cols-2{grid-template-columns:1fr}
    .sec-title h2{font-size:32px}
    .cta{padding:40px 28px}
    .foot-inner{grid-template-columns:1fr 1fr;gap:30px}
    .page{padding:80px 14px 30px}
    .page-title{font-size:28px}
    .page-sub{font-size:14px;margin-bottom:20px}
    .detail-hero{padding:0 0 14px}
    .detail-name{font-size:26px}
    .detail-body{grid-template-columns:1fr;gap:16px}
    .detail-section{margin-bottom:14px}
    .detail-section h3{font-size:15px;margin-bottom:10px}
    .param-table{grid-template-columns:1fr !important;gap:0}
    .param-table .pk{padding:6px 0 2px;border-bottom:none;font-size:12px}
    .param-table .pv{padding:2px 0 8px;border-bottom:1px solid var(--line-2);font-size:13px}
    .station-hero{padding:0 0 12px}
    .station-hero h1{font-size:24px}
    .station-section{margin-bottom:14px}
    .station-section h4{font-size:14px;margin-bottom:8px}
    .station-tags{gap:3px;margin-bottom:10px}
    .station-tag{padding:1px 6px;font-size:11px}
    .sidebar-card{padding-bottom:8px;margin-bottom:8px}
    .sidebar-card .meta-row{font-size:11px;padding:4px 0}
    .breadcrumb{margin-bottom:12px;font-size:11px}
    .form-grid-2{grid-template-columns:1fr}
    .form-card{padding:28px 22px}
  }

  /* ============ 待开通专题 & 跨境标注 ============ */
  .scope-badge{display:inline-flex;align-items:center;gap:4px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1px;padding:2px 8px;border-radius:2px;border:1px solid var(--line);margin-top:8px}
  .scope-xb{background:rgba(224,115,85,.12);color:#e07355;border-color:rgba(224,115,85,.35)}
  .scope-int{background:rgba(97,126,193,.12);color:#7d90c4;border-color:rgba(97,126,193,.35)}
  .scope-dm{background:rgba(107,142,78,.12);color:#9bbf78;border-color:rgba(107,142,78,.3)}
  .up-kpi{border:1px solid var(--line);background:var(--bg-2);padding:16px 20px;border-radius:4px;min-width:130px;display:flex;flex-direction:column;gap:6px}
  .up-kpi .uk-n{font-family:"Big Shoulders Display",sans-serif;font-weight:900;font-size:34px;color:var(--acc);line-height:1}
  .up-kpi.up-kpi-wide{min-width:280px;border-left:3px solid rgba(224,115,85,.6)}
  .up-kpi .uk-line{font-size:13px;font-weight:600;color:var(--ink);font-family:"JetBrains Mono",monospace}
  .up-kpi > span{font-size:12px;color:var(--ink-dim)}
  .up-corr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--ink-dim);padding:10px 14px;border:1px dashed color-mix(in srgb,var(--ink-mute) 30%,transparent);border-radius:4px;margin-bottom:6px}
  .up-corr em{font-style:normal;font-weight:600;color:var(--acc-2)}
  .up-corr small{margin-right:6px;color:var(--ink-mute)}
  .up-group{margin-bottom:18px}
  .up-group-head{display:flex;align-items:baseline;gap:8px;margin:12px 0 2px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .up-group-head small{color:var(--ink-dim);font-family:"JetBrains Mono",monospace;font-size:10.5px}
  .up-badge{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1px;padding:4px 10px;border-radius:2px;border:1px solid var(--line);color:var(--ink-mute)}
  .up-badge.b-soon{background:rgba(224,115,85,.14);color:#e07355;border-color:rgba(224,115,85,.4)}
  .up-badge.b-in12{background:rgba(224,115,85,.08);color:#c98a72;border-color:rgba(224,115,85,.3)}
  .up-badge.b-mid{background:rgba(42,101,204,.08);color:var(--acc);border-color:rgba(42,101,204,.25)}
  .up-badge.b-far{color:var(--ink-mute);border-color:var(--line)}
  .up-list{border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .up-row{display:grid;grid-template-columns:1.2fr .9fr 1.6fr .7fr;gap:12px;align-items:baseline;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .up-row:last-child{border-bottom:none}
  .up-row:hover{background:rgba(42,101,204,.03)}
  .up-name b{font-family:"Noto Serif SC",serif;font-weight:700;color:var(--ink)}
  .up-name .up-scale{display:inline-block;margin-left:8px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-dim);border:1px solid var(--line);padding:1px 5px;border-radius:2px}
  .up-city{color:var(--ink-mute);font-size:13px}
  .up-line{color:var(--ink);font-size:13px}
  .up-line small{display:block;color:var(--ink-dim);font-size:11px;font-family:"JetBrains Mono",monospace}
  .up-open{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--acc);white-space:nowrap}
  .up-note{grid-column:1/-1;color:var(--ink-dim);font-size:12px;margin-top:-4px}
  @media(max-width:720px){
    .up-row{grid-template-columns:1fr 1fr;row-gap:6px}
    .up-line{grid-column:1/-1}
    .up-note{grid-column:1/-1}
    .up-open{justify-self:end}
  }
  /* —— 待开通线路专题 —— */
  .up-line-card{display:flex;flex-direction:column;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:6px;margin-bottom:12px;background:var(--bg)}
  .up-line-card:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
  .ul-top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline}

/* 待开通线路 → 车站 多对多反查索引（运行时按 UPCOMING_LINES 构建） */
function upcomingLinesOfStation(stationName){
  const lines=[];
  UPCOMING_LINES.forEach(l=>{
    if((l.stations||[]).includes(stationName) || (UPCOMING_STATIONS.find(s=>s.name===stationName)||{}).line===l.name) lines.push(l);
  });
  return lines;
}

  'G1':'12306车次快照 train_list.js 2022-08',
  'G7':'12306车次快照 train_list.js 2022-08',
  'D901':'12306车次快照 train_list.js 2022-08',

  'Z97':'已停运；2022快照确实无本车次'
};
function annotateSources(trains){
  if(!Array.isArray(trains)) return trains;
  trains.forEach(t=>{ if(t&&t.code&&TRAIN_SOURCE_CHECKS[t.code]&&!t.source) t.source=TRAIN_SOURCE_CHECKS[t.code]; });
  return trains;
}
let DB = Store.load();
/* 兼容旧数据：没有 trainLines 字段时补空数组 */
if(!DB.trainLines){ DB.trainLines = []; Store.save(DB); }
/* 数据迁移：旧车次没有 validFrom/adjustVersion 时补默认值 */
if(DB.trains && DB.trains.some(t=>!t.validFrom)){
  DB.trains = DB.trains.map(t=>({
    ...t,
    validFrom: t.validFrom || '',
    validUntil: t.validUntil || null,
    adjustVersion: t.adjustVersion || ''
  }));
  Store.save(DB);
}

/* ---------- 关系与生命周期辅助 ---------- */
/* 取车次经过的线路，按 order 排序 */
function linesOfTrain(trainId){
  return (DB.trainLines||[])
    .filter(r=>r.trainId===trainId)
    .sort((a,b)=>(a.order||0)-(b.order||0))
    .map(r=>DB.lines.find(l=>l.id===r.lineId))
    .filter(Boolean);
}
/* 取跑过某线路的所有车次 */
function trainsOfLine(lineId){
  const tids=(DB.trainLines||[]).filter(r=>r.lineId===lineId).map(r=>r.trainId);
  return DB.trains.filter(t=>tids.includes(t.id));
}
/* 车次生命周期状态 */
function trainStatus(t){
  if(t.validUntil) return 'discontinued';
  return 'active';
}
function statusLabel(t){
  return trainStatus(t)==='discontinued' ? '已停运' : '现行';
}

/* ---------- 车站注册 ---------- */
/* 从线路的 stations 字段和车次的 stops 字段提取车站，构建统一注册表 */
/* 车站 = { name, telecode, pinyin, shortCode, seq, city, lineIds: [], trainIds: [] } */
let STATION_REGISTRY = {};

/* 合并车站元数据（电报码等），找不到的保持默认 */
function mergeStationMeta(name, station){
  const meta = STATION_META[name];
  if(meta){
    if(meta.t) station.telecode = meta.t;
    if(meta.p) station.pinyin = meta.p;
    if(meta.s) station.shortCode = meta.s;
    if(meta.i) station.seq = meta.i;
    if(meta.c) station.city = meta.c;
    if(meta.nt) station.note = meta.nt;
    if(meta.scope) station.scope = meta.scope;
    if(meta.country) station.country = meta.country;
  }
  return station;
}
function buildStationRegistry(){
  STATION_REGISTRY = {};
  // 从线路提取
  DB.lines.forEach(l=>{
    (l.stations||'').split(/[·\s]+/).filter(Boolean).forEach(s=>{
      if(!STATION_REGISTRY[s]) STATION_REGISTRY[s]=mergeStationMeta(s,{name:s, lineIds:[], trainIds:[]});
      if(!STATION_REGISTRY[s].lineIds.includes(l.id)) STATION_REGISTRY[s].lineIds.push(l.id);
    });
  });
  // 从车次停站提取
  DB.trains.forEach(t=>{
    (t.stops||[]).forEach(s=>{
      if(!STATION_REGISTRY[s.station]) STATION_REGISTRY[s.station]=mergeStationMeta(s.station,{name:s.station, lineIds:[], trainIds:[]});
      if(!STATION_REGISTRY[s.station].trainIds.includes(t.id)) STATION_REGISTRY[s.station].trainIds.push(t.id);
    });
  });
  // 补充关联线路：从车次停站关联到线路
  DB.trains.forEach(t=>{
    const lines = linesOfTrain(t.id);
    (t.stops||[]).forEach(s=>{
      const st = STATION_REGISTRY[s.station];
      if(st){
        lines.forEach(l=>{
          if(st.lineIds.includes(l.id)) return;
          // 只加该线路确实经过的车站
          const lineStations = (l.stations||'').split(/[·\s]+/).filter(Boolean);
          if(lineStations.includes(s.station) || lineStations.some(ls=>s.station.includes(ls)||ls.includes(s.station))){
            st.lineIds.push(l.id);
          }
        });
      }
    });
  });
  return STATION_REGISTRY;
}
function getStations(){
  return Object.values(STATION_REGISTRY).sort((a,b)=>a.name.localeCompare(b.name));
}
function getStation(name){
  return STATION_REGISTRY[name] || null;
}
// 线路的站点列表（按顺序）
function lineStationList(line){
  return (line.stations||'').split(/[·\s]+/).filter(Boolean).map(s=>STATION_REGISTRY[s]).filter(Boolean);
}

/* 构建车站注册表 */
buildStationRegistry();

/* ---------- 工具 ---------- */
function $(sel,ctx){return (ctx||document).querySelector(sel)}
function $$(sel,ctx){return Array.from((ctx||document).querySelectorAll(sel))}
function escapeHTML(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function genId(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function genNo(list){const max=list.reduce((m,x)=>{const n=parseInt(String(x.no).replace(/\D/g,''),10);return isNaN(n)||n<m?m:n},0);return String(max+1).padStart(5,'0')}

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ---------- 路由 ---------- */
function route(){
  const hash=location.hash.replace(/^#/,'')||'/';
  const pathOnly=hash.split('?')[0]; // 剥离 query，query 由各视图自行从 location.hash 解析
  const parts=pathOnly.split('/').filter(Boolean);
  const path=parts.join('/');
  render(path);
  window.scrollTo(0,0);
}
function go(p){location.hash='#/'+p.replace(/^\//,'');}

window.addEventListener('hashchange',route);
window.addEventListener('DOMContentLoaded',route);

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-route]');
  if(el){e.preventDefault();go(el.dataset.route);}
});

/* 作用域/跨境徽章（车站详情的跨境标注） */
function upcomingScopeBadge(st){
  if(st.scope==='cross-border') return `<span class="scope-badge scope-xb">跨境 ⤳ ${escapeHTML(st.country||'')}</span>`;
  if(st.scope==='international') return `<span class="scope-badge scope-int">境外 · ${escapeHTML(st.country||'')}</span>`;
  if(st.scope==='domestic') return `<span class="scope-badge scope-dm">国内</span>`;
  return '';
}
/* 把 open 解析为可用于排序/倒计时的日期 */
function upcomingSortDate(open){
  if(/^\d{4}-\d{2}-\d{2}$/.test(open)) return open;
  if(/^\d{4}-\d{2}$/.test(open)) return open+'-15';
  if(/^\d{4}$/.test(open)) return open+'-06-30';
  return '2999-12-31';
}
function upcomingDays(open){
  const s=upcomingSortDate(open);
  if(!/^\d{2}-\d{2}$/.test(s.slice(5))) return null;
  const d1=new Date(s).getTime();
  const d2=new Date(todayStr()).getTime();
  return Math.max(1, Math.round((d1-d2)/86400000));
}
function upcomingBucket(sortDate){
  const y=parseInt(sortDate.slice(0,4),10), m=parseInt(sortDate.slice(5,7),10);
  const now=new Date(), ny=now.getFullYear(), nm=now.getMonth()+1;
  const months=(y-ny)*12+(m-nm);
  if(months<=0) return {label:'已进入倒计时',key:'soon',cls:'b-soon'};
  if(months<=12) return {label:'一年内开通',key:'in12',cls:'b-in12'};
  if(months<=36) return {label:'1–3 年',key:'mid',cls:'b-mid'};
  return {label:'3 年以上（远期）',key:'far',cls:'b-far'};
}
/* 省份提取（city 为「省份+地市」黏连，直辖市直接为城市名） */
const PROV_KEYS=['黑龙江','内蒙古','北京','天津','河北','山西','辽宁','吉林','上海','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','重庆','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆'];
function upProvinceOf(s){
  const c=(s.city||s.name||'').toString();
  for(const p of PROV_KEYS){ if(c.indexOf(p)===0) return p; }
  return '';
}
function upProvinces(){
  const m={};
  UPCOMING_STATIONS.forEach(x=>{const p=upProvinceOf(x); if(p) m[p]=(m[p]||0)+1;});
  return Object.keys(m).sort((a,b)=>m[b]-m[a]||a.localeCompare(b,'zh')).map(p=>({name:p,count:m[p]}));
}
function viewUpcoming(){
  const pm=typeof location!=='undefined'&&location.hash?location.hash.match(/prov=([^&]+)/):null;
  const provFilter=pm?decodeURIComponent(pm[1]):'';
  const all=UPCOMING_STATIONS.slice();
  const working=provFilter?all.filter(x=>upProvinceOf(x)===provFilter):all;
  const provCards=upProvinces();
  const now=new Date().getFullYear();

  const list=working.map(x=>({...x, sort:upcomingSortDate(x.open)}));
  list.sort((a,b)=>a.sort<b.sort?-1:a.sort>b.sort?1:0);
  const count=list.length;
  const soonCount=working.filter(x=>parseInt(upcomingSortDate(x.open).slice(0,4),10)>=now).length;
  const nextYear=list.find(x=>(/^\d{4}-\d{2}-\d{2}$/.test(x.sort)&&x.sort>=todayStr()))||list.find(x=>x.sort>=upcomingSortDate(String(now+1)));

  const groups=[];
  working.forEach(x=>{
    const s=upcomingSortDate(x.open);
    const b=upcomingBucket(s);
    let g=groups.find(g=>g.key===b.key);
    if(!g){g={...b, items:[]};groups.push(g);}
    g.items.push({...x, sort:s, bucket:b});
  });
  groups.forEach(g=>g.items.sort((a,b)=>a.sort<b.sort?-1:a.sort>b.sort?1:0));

  const scopeSummary=(()=>{const c=Object.keys(GLOBAL_SCOPE.corridors||{});if(!c.length)return '';return `<div class="up-corr">跨境走廊：${c.map(k=>{const co=GLOBAL_SCOPE.corridors[k];return `<em>${escapeHTML(k)}</em><small>${co.border.map(escapeHTML).join('、')}</small>`}).join('')}</div>`;})();

  const provCardsHtml = provCards.length?`
    <div class="up-cards">
      ${provCards.map(p=>`
        <a class="up-card${p.name===provFilter?' cur':''}" data-goto="/upcoming${p.name===provFilter?'':'?prov='+encodeURIComponent(p.name)}" title="查看 ${escapeHTML(p.name)} 待开通车站">
          <b>${p.count}</b><span>${escapeHTML(p.name)}</span>
        </a>`).join('')}
    </div>`:'';

  const banner = provFilter?`
    <div class="up-prov-banner"><b>${escapeHTML(provFilter)} · 待开通车站</b><small>${count} 站</small><a class="up-prov-back" data-goto="/upcoming">← 返回全部省份</a></div>`:'';

  const groupHtml = groups.map(g=>`
      <div class="up-group">
        <div class="up-group-head"><span class="up-badge ${g.cls}">${g.label}</span><small>${g.items.length} 站</small></div>
        ${g.items.map(x=>`
          <div class="uc-row" data-station="${encodeURIComponent(x.name)}">
            <span class="uc-name">${escapeHTML(x.name)}${x.scale?`<small>${escapeHTML(x.scale)}</small>`:''}</span>
            <span class="uc-dim">${escapeHTML(x.city)}</span>
            <span class="uc-line">${escapeHTML(x.line)} · ${escapeHTML(x.ltype||'')} · ${escapeHTML(x.status||'')}</span>
            <span class="uc-dim">${escapeHTML(x.open||'')}</span>
            ${x.note?`<span class="uc-note">${escapeHTML(x.note)}</span>`:''}
          </div>`).join('')}
      </div>`).join('');

  return `
  <div class="page">
    <div class="breadcrumb"><a data-route="/">首页</a><span class="sep">/</span><span>车站 · 待开通专题</span></div>
    <h1 class="page-title">待开通车站</h1>
    <div class="page-sub">Upcoming Stations · ${count} 站 · ${provFilter?`筛选于 <b>${escapeHTML(provFilter)}</b>`:'按省份归档，点击卡片可筛'} · 开通时间由工程预期推定，以官方发布为准</div>

    <div class="up-tally">共 <b>${count}</b> 站 · <em>${soonCount}</em> 站 ${now} 年起陆续开通${nextYear?` · 下一确定性节点 <b>${escapeHTML(nextYear.name)}</b>（${escapeHTML(nextYear.open||'')}）`:''}</div>

    ${provCardsHtml}
    ${provFilter?banner:''}

    ${scopeSummary}

    ${groupHtml||'<div class="up-empty">该省暂无已收录待开通车站。</div>'}
  </div>`;
}

/* 待开通线路状态分档徽章：0 联调联试/铺轨（临近）1 在建 2 拟建/远期 */
function upcomingLineStatusTag(status){
  const s=status||'';
  let cls='t-1', label=s;
  if(/联调联试|铺轨|试运行|开通在即/.test(s)){cls='t-0';}
  else if(/在建|施工/.test(s)){cls='t-1';}
  else{cls='t-2';}
  return `<span class="uc-tag ${cls}">${escapeHTML(label)}</span>`;
}

      <div class="up-group">

            ${l.note?`<span class="uc-note">${escapeHTML(l.note)}</span>`:''}
            <span class="uc-chips">
              ${(l.stations||[]).map(s=>`

/* ---------- 车次演变时间线 ---------- */
function trainVersionList(x){
  /* 优先用 versions[]；否则从旧字段构造单版本 */
  if((x.versions||[]).length) return x.versions;
  return [{ validFrom:x.validFrom||'', validUntil:x.validUntil||null, change:'', adjustVersion:x.adjustVersion||'' }];
}
function renderVersions(x){
  const list=trainVersionList(x).slice().reverse(); // 最新在上
  const active=(!x.validUntil || new Date(x.validUntil)>new Date());
  const goMark = `<span class="mark m-go">现行</span>`;
  const stopMark = `<span class="mark m-stop">已停</span>`;
  const items = list.map((v,i)=>{
    const isLast=(i===list.length-1);
    const oldCls = isLast ? (active?'':'') : '';
    // 判断该版本id对应当前车次：最后一个即当前
    const cls = i===0 ? '' : 'old';
    const mark = i===0 ? (active?goMark:stopMark) : '';
    const badge = v.isStop ? stopMark : (v.isCurrent ? goMark : '');
    const rel = v.adjustVersion ? `<span class="vrel">${escapeHTML(v.adjustVersion)}</span>` : '';
    return `
      <div class="ver-tli ${cls}">
        <div class="vd">${escapeHTML(v.validFrom||'—')}${v.validUntil?' → '+escapeHTML(v.validUntil):''} ${rel}</div>
        <div class="vt">${escapeHTML(v.change||(i===0?'当前生效版本':'历史版本'))} ${mark||badge}</div>
        ${v.note?`<div class="vr">${escapeHTML(v.note)}</div>`:''}
      </div>`;
  }).join('');
  return `
    <div class="ver-tl">${items}</div>
    <button class="ver-add" onclick="addVersion('${x.id}')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      新增版本
    </button>`;
}

function mockCommentData(x){
  const from=x.from||''; const to=x.to||''; const code=x.code||''; const dur=x.duration||'';
  const model=x.model||''; const isTrain=model==='高铁'||model==='动车';
  const rk=520+((code.charCodeAt(0)||0)%7)*113;
  /* 按车型编排多条不同角度的评论，至少3条 */
  return [

    { author:'K1557 窗边客', date:'昨天 21:40',
      text:`这车在 ${from} 发车 ${x.depart||'—'}，到 ${to} ${x.arrive||'—'}，${x.duration?x.duration+'下来':''}节奏很舒服。${isTrain?'车上 WiFi 满格、插座 USB 都有，办公党狂喜':'卧铺休息好，一觉到站，性价比绝了'}。`,

}

function addVersion(id){
  const t=DB.trains.find(x=>x.id===id);
  if(!t) return;
  if(!t.versions) t.versions=trainVersionList(t);
  const d=new Date().toISOString().slice(0,10);
  t.versions.push({ validFrom:d, validUntil:null, change:'', adjustVersion:'' });
  saveDB(); render();
}

/* 模板切换条：让用户在示例基础上修改而非从零填写 */
function renderTplBar(type,activeKey){
  const labels = type==='line'
    ? ['沪苏湖高铁','川藏铁路','哈大高铁']
    : ['G99 沪昆标杆','Z21 京藏直达','Z164 沪藏直达'];
  let html = '<div class="tpl-switcher"><span class="tpl-label">从示例开始修改：</span>';
  labels.forEach((label,i)=>{
    const k=String(i);
    html += `<button type="button" class="tpl-chip ${activeKey===k?'active':''}" onclick="switchTpl('${type}',${i})">${label}</button>`;
  });
  html += `<button type="button" class="tpl-chip tpl-blank ${activeKey==='blank'?'active':''}" onclick="switchTpl('${type}','blank')">空白填写</button>`;
  html += '</div>';
  return html;
}
window.switchTpl=function(type,tpl){
  go('/contribute?type='+type+'&tpl='+tpl);
};
/* 线路多选：切换选中态视觉 */
window.toggleLinePick=function(input){
  const label=input.closest('.line-pick');

};

/* ---------- 表单提交 ---------- */
window.submitLineForm=function(id){
  const form=document.querySelector('form');
  const fd=new FormData(form);
  const obj={
    name:fd.get('name').trim(),
    latin:fd.get('latin').trim(),
    from:fd.get('from').trim(),
    to:fd.get('to').trim(),
    length:parseInt(fd.get('length'),10)||0,
    opened:fd.get('opened').trim(),
    electrified:fd.get('electrified'),
    double:fd.get('double').trim(),
    grade:fd.get('grade').trim(),
    voltage:fd.get('voltage').trim(),
    maxSpeed:fd.get('maxSpeed').trim(),
    stations:fd.get('stations').trim(),
    desc:fd.get('desc').trim(),
    timeline:fd.get('timeline').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const [d,...t]=l.split('|');return {date:d.trim(),text:t.join('|').trim()};
    })
  };
  if(id){
    const i=DB.lines.findIndex(x=>x.id===id);
    if(i>=0){DB.lines[i]={...DB.lines[i],...obj};Store.save(DB);toast('档案已更新');go('/lines/'+id);}
  }else{
    obj.id=genId('L');
    obj.no=genNo(DB.lines);
    obj.createdAt=todayStr();
    DB.lines.push(obj);Store.save(DB);
    toast('档案已入库');
    go('/lines/'+obj.id);
  }
};

window.submitTrainForm=function(id){
  const form=document.querySelector('form');
  const fd=new FormData(form);
  const lineIds=fd.getAll('lines'); // 按 DOM 顺序，即勾选顺序
  const obj={
    code:fd.get('code').trim(),
    model:fd.get('model'),
    from:fd.get('from').trim(),
    to:fd.get('to').trim(),
    depart:fd.get('depart').trim(),
    arrive:fd.get('arrive').trim(),
    duration:fd.get('duration').trim(),
    maxSpeed:fd.get('maxSpeed').trim(),
    trainType:fd.get('trainType').trim(),
    adjustVersion:fd.get('adjustVersion').trim(),
    formation:fd.get('formation').trim(),
    operator:fd.get('operator').trim(),
    validFrom:fd.get('validFrom').trim(),
    validUntil:fd.get('validUntil').trim()||null,
    stops:fd.get('stops').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const [s,...t]=l.split('|');return {station:s.trim(),time:t.join('|').trim()};
    }),
    versions:fd.get('versions').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const p=l.split('|').map(x=>x.trim());
      return { validFrom:p[0]||'', validUntil:p[1]||null, change:p[2]||'', adjustVersion:p[3]||'' };
    }),
    desc:fd.get('desc').trim()
  };
  const saveRelations=(trainId)=>{
    DB.trainLines = DB.trainLines.filter(r=>r.trainId!==trainId);
    lineIds.forEach((lid,i)=>DB.trainLines.push({trainId,lineId:lid,order:i+1}));
  };
  if(id){
    const i=DB.trains.findIndex(x=>x.id===id);
    if(i>=0){DB.trains[i]={...DB.trains[i],...obj};saveRelations(id);Store.save(DB);toast('档案已更新');go('/trains/'+id);}
  }else{
    obj.id=genId('T');
    obj.no=genNo(DB.trains);
    obj.createdAt=todayStr();
    DB.trains.push(obj);saveRelations(obj.id);Store.save(DB);
    toast('档案已入库');
    go('/trains/'+obj.id);
  }
};

/* ---------- 删除 ---------- */
window.deleteEntry=function(type,id){
  const x = type==='line' ? DB.lines.find(l=>l.id===id) : DB.trains.find(t=>t.id===id);
  const name = type==='line' ? (x&&x.name) : (x&&x.code+' 次');
  showModal('确认删除',`确定要删除「${name}」吗？此操作不可撤销。`,()=>{
    if(type==='line'){
      DB.lines=DB.lines.filter(l=>l.id!==id);
      DB.trainLines=DB.trainLines.filter(r=>r.lineId!==id);
    }else{
      DB.trains=DB.trains.filter(t=>t.id!==id);
      DB.trainLines=DB.trainLines.filter(r=>r.trainId!==id);
    }
    Store.save(DB);
    toast('档案已删除');
    go(type==='line'?'/lines':'/trains');
  });
};

window.globalSearch=function(q){
  q=(q||'').trim();
  if(!q){go('/lines');return;}
  // 如果搜索的车站名，直接跳转到车站页面
  const st = getStation(q);
  if(st){go('/stations/'+encodeURIComponent(q));return;}
  window.__lineFilter.q=q;
  window.__trainFilter.q=q;
  // 智能跳转：先看列车车次特征
  if(/^[GDCZTK]\d+$/i.test(q)){go('/trains');}
  else{go('/lines');}
};

});

/* ---------- 渲染入口 ---------- */
function render(path){
  const app=$('#app');
  let html='';
  // update nav active
  $$('.nav-links a').forEach(a=>{
    const r=a.dataset.route;
    const key=r?r.replace(/^\//,''):'';
    const isActive=(path===''&&key==='')||(path!==''&&key&&path===key)||(path!==''&&key&&path.startsWith(key+'/'));
    a.classList.toggle('active', isActive);
  });

  if(path===''||path==='/'){html=viewHome();}
  else if(path==='lines'){html=viewLines();}
  else if(path==='trains'){html=viewTrains();}
  else if(path==='stations'){html=viewStations();}
  else if(path==='upcoming'){html=viewUpcoming();}
  else if(path==='upcoming-lines'){html=viewUpcomingLines();}
  else if(path==='contribute'){
    const m=location.hash.match(/type=(line|train)/);
    html=viewForm(m?m[1]:'line');
  }
  else if(path.startsWith('lines/')){html=viewLineDetail(path.split('/')[1]);}
  else if(path.startsWith('trains/')){html=viewTrainDetail(path.split('/')[1]);}
  else if(path.startsWith('stations/')){html=viewStationDetail(decodeURIComponent(path.split('/')[1]));}
  else if(path.startsWith('edit/line/')){html=viewForm('line',path.split('/')[2]);}
  else if(path.startsWith('edit/train/')){html=viewForm('train',path.split('/')[2]);}
  else{html=notFound('页面');}

  app.innerHTML=html;
  // rebind data-route clicks inside app
  $$('#app [data-route]').forEach(el=>{
    el.addEventListener('click',e=>{e.preventDefault();go(el.dataset.route);});
  });
  // rebind data-goto hash-jump clicks (待开通线路→车站跳转)
  $$('#app [data-goto]').forEach(el=>{
    el.addEventListener('click',e=>{e.preventDefault();go(el.dataset.goto);});
  });
  // 待开通车站：定位到 focus 指定的站行
  if(path==='upcoming'){
    const m=location.hash.match(/focus=([^&]+)/);
    if(m){
      const nm=decodeURIComponent(m[1]);
      const row=Array.from($$('#app .uc-row')).find(r=>{
        const t=r.querySelector('.uc-name'); return t && t.childNodes[0] && t.childNodes[0].textContent.trim()===nm;
      });
      if(row) setTimeout(()=>row.scrollIntoView({behavior:'smooth',block:'center'}),60);
    }
  }
}

/* ---------- 字段级就地编辑 ---------- */
const FIELD_LABELS={
  code:'车次',model:'车型',trainType:'车种',from:'起点',to:'终点',
  depart:'发车时间',arrive:'到达时间',duration:'全程耗时',formation:'编组',
  maxSpeed:'最高速度',operator:'担当局',desc:'简介',
  length:'全长',opened:'建成通车',grade:'铁路等级',electrified:'电气化',
  double:'复线状态',voltage:'供电制式',name:'名称',latin:'英文名',stations:'沿线车站'
};
function fieldLabel(f){
  if(FIELD_LABELS[f]) return FIELD_LABELS[f];
  // 路径形式：stops.0.station / timeline.0.date
  const m=f.match(/^(stops|timeline)\.\d+\.(station|time|date|text)$/);
  if(m) return m[1]==='stops' ? (m[2]==='station'?'停站':'时刻') : (m[2]==='date'?'日期':'事件');
  return f;
}
function getPathVal(item,path){
  const parts=path.split('.');
  let v=item;
  for(const p of parts){ if(v==null) return undefined; v=v[p]; }
  return v;
}
function setPathVal(item,path,val){
  const parts=path.split('.');
  let v=item;
  for(let i=0;i<parts.length-1;i++){ v=v[parts[i]]; }
  v[parts[parts.length-1]]=val;
}
function makeEditable(el){
  const type=el.dataset.type, id=el.dataset.id, field=el.dataset.field;
  const coll = type==='train' ? DB.trains : DB.lines;
  const item = coll.find(x=>x.id===id);
  if(!item) return;
  const current = getPathVal(item,field);
  const curStr = current==null ? '' : String(current);
  // 占位符「-」视为空
  const isPlaceholder = curStr==='-';
  const input=document.createElement('input');
  input.className='pv-editing';
  input.value = isPlaceholder ? '' : curStr;
  input.dataset.type=type; input.dataset.id=id; input.dataset.field=field;
  // 多行字段用 textarea
  if(field==='desc' || /^timeline\.\d+\.text$/.test(field)){
    const ta=document.createElement('textarea');
    ta.className='pv-editing';
    ta.value=isPlaceholder?'':curStr;
    ta.rows=3;
    ta.style.width='100%';
    ta.style.minHeight='80px';
    ta.style.resize='vertical';
    ta.dataset.type=type; ta.dataset.id=id; ta.dataset.field=field;
    el.replaceWith(ta);
    ta.focus(); ta.select();
    bindEditInput(ta,type,id,field,item,curStr);
    return;
  }
  el.replaceWith(input);
  input.focus(); input.select();
  bindEditInput(input,type,id,field,item,curStr);
}
function bindEditInput(input,type,id,field,item,oldVal){
  let done=false;
  const finish=(cancel)=>{
    if(done) return; done=true;
    if(!cancel){
      let v=input.value.trim();
      // 数字字段转 number
      if(['maxSpeed','length'].includes(field) && v!=='' && !isNaN(Number(v))){
        v=Number(v);
      }
      const before=getPathVal(item,field);
      // 空值落为空字符串（展示时再回退「-」）
      setPathVal(item,field, v==='' ? '' : v);
      saveDB();
      toast(`${fieldLabel(field)} 已更新`);
    }
    // 重新渲染当前视图（保留 hash）
    route(location.hash.slice(1)||'/');
  };
  input.addEventListener('blur',()=>finish(false));
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter' && input.tagName!=='TEXTAREA'){e.preventDefault();input.blur();}
    else if(e.key==='Enter' && input.tagName==='TEXTAREA' && (e.ctrlKey||e.metaKey)){e.preventDefault();input.blur();}
    else if(e.key==='Escape'){e.preventDefault();finish(true);}
  });
}
// 事件委托：点击 .pv-editable 触发就地编辑
document.addEventListener('click',e=>{
  const el=e.target.closest('.pv-editable');
  if(el){ e.preventDefault(); makeEditable(el); }
});
</script>
